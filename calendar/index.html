<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar</title>
    <style>
      .pdf-container {
        width: 100%;
        max-width: 100vw;
        /* Match your landscape aspect ratio (width / height) */
        aspect-ratio: 11 / 8.5;
        overflow: hidden; /* Suppresses outer scrollbars */
        margin: 0 auto;
      }

      .pdf-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .responsive-pdf {
        width: 100%;
        /* Set aspect ratio to match your document (A4 = 1/1.414, US Letter = 8.5/11) */
        aspect-ratio: 8.5 / 11;

        /* Ensure it never overflows the viewport screen */
        max-width: 100vw;
        max-height: 100vh;

        border: none;
        display: block;
        margin: 0 auto; /* Center horizontally */
      }
    </style>
  </head>
  <body>
    <div class="pdf-container">
      <iframe src="october.pdf#view=FitW"></iframe>
    </div>
  </body>
</html>
